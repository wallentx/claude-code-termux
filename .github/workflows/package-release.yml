name: Package Termux release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream Claude Code version, or latest
        required: true
        default: latest
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build Termux artifact
    runs-on: [self-hosted, termux, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Package release
        run: scripts/package-release.sh "${{ inputs.version }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: claude-termux-release
          path: |
            dist/*.tar.gz
            dist/*.sha256
