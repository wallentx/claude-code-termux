name: Package Termux release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Upstream Claude Code version, or latest
        required: true
        default: latest
        type: string

permissions:
  attestations: write
  contents: write
  id-token: write

concurrency:
  group: package-termux-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  package:
    name: Build native Termux artifact
    uses: wallentx/gh-actions/.github/workflows/termux-run.yml@main
    with:
      packages: |
        binutils
        ca-certificates
        clang
        curl
        file
        git
        glibc
        glibc-runner
        resolv-conf
        tar
      env: |
        RELEASE_VERSION=${{ inputs.version }}
      commands: |
        set -Eeuo pipefail

        .github/scripts/package-release.sh "$RELEASE_VERSION"
      sync-back-paths: |
        dist
      upload-artifact-name: claude-termux-release

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: claude-termux-release
          path: dist
      - name: Read release metadata
        id: release
        run: |
          set -Eeuo pipefail

          # release.env is generated by the package job and carried with its artifact.
          source dist/release.env
          for name in actual_version release_tag archive checksum_file; do
            value="${!name:-}"
            test -n "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
          done
      - name: Attest release archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ steps.release.outputs.archive }}
      - name: Attest release checksum
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/${{ steps.release.outputs.checksum_file }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          ACTUAL_VERSION: ${{ steps.release.outputs.actual_version }}
          ARCHIVE: ${{ steps.release.outputs.archive }}
          CHECKSUM_FILE: ${{ steps.release.outputs.checksum_file }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice title=Release already exists::$RELEASE_TAG"
            exit 0
          fi

          notes="$RUNNER_TEMP/claude-termux-release-notes.md"
          {
            echo "Termux packaging for Claude Code $ACTUAL_VERSION."
            echo
            echo "This release contains the native Termux launcher and the patched upstream linux-arm64 payload."
            echo
            echo "Install with:"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/install.sh | bash"
            echo '```'
          } >"$notes"

          gh release create "$RELEASE_TAG" \
            "dist/$ARCHIVE" \
            "dist/$CHECKSUM_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Claude Code $ACTUAL_VERSION for Termux" \
            --notes-file "$notes"
