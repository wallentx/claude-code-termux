name: Termux compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect artifact changes
    runs-on: ubuntu-latest
    outputs:
      termux_compat: ${{ steps.changed.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether to run
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/ci-should-run.py termux-compat
      - name: Skip reason
        if: steps.changed.outputs.should_run != 'true'
        env:
          SKIP_REASON: ${{ steps.changed.outputs.reason }}
        run: echo "$SKIP_REASON"

  portable:
    name: Portable checks
    needs: changes
    if: ${{ needs.changes.outputs.termux_compat == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Shell syntax
        run: bash -n build.sh install.sh .github/scripts/compat-test.sh .github/scripts/release-check.sh .github/scripts/package-release.sh
      - name: ShellCheck
        run: shellcheck build.sh install.sh .github/scripts/compat-test.sh .github/scripts/release-check.sh .github/scripts/package-release.sh
      - name: Upstream release metadata
        run: .github/scripts/release-check.sh --json

  artifact-build:
    name: Native Termux artifact and runtime checks
    needs: changes
    if: ${{ needs.changes.outputs.termux_compat == 'true' }}
    uses: wallentx/gh-actions/.github/workflows/termux-run.yml@main
    with:
      packages: |
        binutils
        ca-certificates
        clang
        curl
        file
        git
        glibc
        glibc-runner
        resolv-conf
        tar
      commands: |
        set -Eeuo pipefail

        .github/scripts/package-release.sh latest
        .github/scripts/compat-test.sh --artifacts --skip-build --network --auth-probe
