name: Detect upstream release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  actions: write

jobs:
  compare-tags:
    name: Compare upstream and Termux tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check upstream release tag
        run: scripts/release-check.sh --json | tee release-check.json
      - name: Report release status
        run: |
          status="$(jq -r '.status' release-check.json)"
          latest="$(jq -r '.latest' release-check.json)"
          local_version="$(jq -r '.local_version // "none"' release-check.json)"
          local_tag="$(jq -r '.local_tag // "none"' release-check.json)"
          case "$status" in
            up_to_date)
              echo "::notice title=Termux release current::upstream=$latest tag=$local_tag"
              ;;
            initial_release_required)
              echo "::warning title=Initial Termux release needed::upstream=$latest; no v*-termux release tag exists yet"
              ;;
            update_available)
              echo "::warning title=Termux release needed::upstream=$latest local=$local_version tag=$local_tag"
              ;;
            *)
              echo "::warning title=Termux release status::status=$status upstream=$latest local=$local_version tag=$local_tag"
              ;;
          esac
      - name: Dispatch package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_required="$(jq -r '.release_required' release-check.json)"
          latest="$(jq -r '.latest' release-check.json)"
          status="$(jq -r '.status' release-check.json)"

          if [ "$release_required" != "true" ]; then
            echo "::notice title=No release dispatch needed::status=$status"
            exit 0
          fi

          gh workflow run package-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field "version=$latest"

          echo "::notice title=Package release dispatched::version=$latest status=$status"
          echo "- Dispatched package-release.yml for upstream $latest ($status)." >> "$GITHUB_STEP_SUMMARY"
      - name: Write summary
        if: always()
        run: |
          {
            echo "## Claude Termux release detection"
            echo
            echo '```json'
            if [ -f release-check.json ]; then
              cat release-check.json
            else
              scripts/release-check.sh --json || true
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
